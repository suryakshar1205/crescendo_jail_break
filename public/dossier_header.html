<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crescendo Multi-Turn Jailbreak Defense — Master Verified Results Dossier</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Marked Markdown Parser & DOMPurify Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <!-- MathJax Configuration for KaTeX / LaTeX Equations -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- Mermaid.js for Dynamic Architecture Flowcharts -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>


  <style>
    :root {
      --bg-primary: #07090e;
      --bg-secondary: #0d121d;
      --bg-surface: #131b2c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --border-accent: rgba(56, 189, 248, 0.35);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-indigo: #6366f1;
      --accent-amber: #f59e0b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Reading Progress bar */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #6366f1, #10b981);
      width: 0%;
      z-index: 1000;
      transition: width 0.08s linear;
    }

    /* Header Nav */
    .dossier-nav {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(7, 9, 14, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .nav-logo {
      font-size: 24px;
    }

    .nav-title-text h1 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .nav-title-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-emerald {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .badge-cyan {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Main Grid Layout */
    .dossier-layout {
      display: flex;
      max-width: 1560px;
      margin: 0 auto;
      padding: 24px;
      gap: 28px;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 310px;
      flex-shrink: 0;
      position: sticky;
      top: 75px;
      height: calc(100vh - 95px);
      overflow-y: auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 4px;
    }

    .sidebar-search {
      margin-bottom: 12px;
    }

    .sidebar-search input {
      width: 100%;
      padding: 7px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-family: var(--font-sans);
    }

    .sidebar-search input:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }

    .sidebar h4 {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .toc-item a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      display: block;
      padding: 5px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
      line-height: 1.35;
    }

    .toc-item a:hover {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
    }

    .toc-item.active a {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      font-weight: 600;
      border-left: 2px solid #38bdf8;
    }

    .toc-subitem {
      padding-left: 14px;
      font-size: 11px;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      min-width: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 40px 48px;
    }

    /* Typography */
    .content-area h1 {
      font-family: var(--font-display);
      font-size: 27px;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-medium);
      padding-bottom: 14px;
    }

    .content-area h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 36px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    .content-area h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .content-area h4 {
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    .content-area p {
      margin-bottom: 14px;
      color: #cbd5e1;
    }

    .content-area blockquote {
      background: rgba(56, 189, 248, 0.05);
      border-left: 3px solid var(--accent-cyan);
      padding: 10px 16px;
      border-radius: 0 6px 6px 0;
      margin: 14px 0;
      font-size: 13.5px;
      color: #cbd5e1;
    }

    .content-area hr {
      border: none;
      height: 1px;
      background: var(--border-subtle);
      margin: 32px 0;
    }

    /* Tables */
    .content-area table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 13px;
      background: var(--bg-surface);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .content-area th {
      background: rgba(14, 165, 233, 0.12);
      color: #f8fafc;
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-medium);
      font-family: var(--font-display);
    }

    .content-area td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
    }

    .content-area tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    .content-area code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }

    .content-area pre {
      background: #090d16;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      margin: 16px 0;
    }

    .content-area pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: #e2e8f0;
    }

    .content-area .mermaid {
      background: #090d16;
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      padding: 24px;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .content-area ul, .content-area ol {
      margin-left: 24px;
      margin-bottom: 14px;
    }

    .content-area li {
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    /* Images & Visual Plots */
    .content-area img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-medium);
      margin: 14px 0;
      background: #0d121d;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: zoom-in;
    }

    .content-area img:hover {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-color: var(--accent-cyan);
      transform: scale(1.01);
    }

    /* Table embedded image styling */
    .content-area td img {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 160px;
      height: auto !important;
      display: block !important;
      margin: 6px auto !important;
      border-radius: 6px;
    }

    /* Lightbox Modal */
    #image-lightbox {
      display: none;
      position: fixed;
      z-index: 99999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      cursor: zoom-out;
      padding: 24px;
    }

    #image-lightbox.active {
      display: flex;
    }

    #image-lightbox img {
      max-width: 92vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid var(--border-accent);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      cursor: default;
    }

    #image-lightbox .lightbox-caption {
      color: var(--text-primary);
      font-size: 14px;
      margin-top: 14px;
      font-weight: 500;
      text-align: center;
      max-width: 800px;
    }

    #image-lightbox .lightbox-close {
      position: absolute;
      top: 20px;
      right: 28px;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    #image-lightbox .lightbox-close:hover {
      opacity: 1;
      color: var(--accent-cyan);
    }

    /* Print Optimization */
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      .dossier-nav, .sidebar, #reading-progress {
        display: none !important;
      }
      .dossier-layout {
        display: block;
        padding: 0;
      }
      .content-area {
        background: #fff;
        border: none;
        padding: 0;
        color: #000;
      }
      .content-area h1, .content-area h2, .content-area h3 {
        color: #000;
      }
      .content-area table {
        border: 1px solid #ccc;
      }
      .content-area th {
        background: #eee;
        color: #000;
      }
      .content-area td {
        color: #111;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>

  <!-- Raw Embedded Markdown Data -->
  <script id="raw-markdown-data" type="text/markdown">
